<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT40.A12.Solari</title>
<!-- CT40.A12.Solari — split-flap (Solari) departure board, WebGL via three.js r160 loaded from ./lib (no internet needed).
     A12: "● Record from Reset" makes an MP4 movie (picture + clacks) of the sign starting from a reset. -->
<style>
  :root { --label:#d8d6ce; --bar:#0d0d0d; --btn:#1c1c1c; --btnh:#2a2a2a; --txt:#e8e6de; --dim:#8a887f; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; color:var(--txt);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; }
  #gl { position:fixed; left:0; top:0; width:100vw; height:100vh; display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .lab { position:absolute; white-space:nowrap; color:var(--label); font-weight:bold; letter-spacing:0.12em; }
  #title { position:absolute; white-space:nowrap; color:var(--label); font-weight:bold; letter-spacing:0.2em; }
  #bar { position:fixed; left:0; right:0; bottom:0; min-height:52px; padding-top:6px !important; padding-bottom:6px !important; row-gap:6px; background:var(--bar); border-top:1px solid #222;
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; padding:0 12px; box-sizing:border-box;
    font-size:13px; }
  .grp { display:flex; align-items:center; gap:6px; }
  button { background:var(--btn); color:var(--txt); border:1px solid #333; border-radius:4px; padding:6px 11px;
    font:inherit; font-weight:bold; cursor:pointer; min-width:34px; }
  button:hover { background:var(--btnh); }
  button.on { border-color:#b9b39a; color:#fff; }
  #speedv, #sizev { min-width:48px; text-align:center; font-variant-numeric:tabular-nums; font-weight:bold; }
  input[type=range] { width:110px; accent-color:#bdb7a0; }
  .sep { width:1px; height:26px; background:#2a2a2a; }
  #src { color:var(--dim); font-size:11px; max-width:230px; line-height:1.25; }
  #toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#1b1b1b; border:1px solid #444;
    padding:8px 14px; border-radius:6px; font-size:13px; display:none; z-index:5; cursor:pointer; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000; color:#f88;
    font-size:15px; padding:30px; text-align:center; white-space:pre-wrap; }
  #file { display:none; }
  /* A12: recording */
  #bRec.rec { background:#5a0d0d; border-color:#e04040; color:#fff; }
  #bRec.busy { opacity:0.6; cursor:wait; }
  #recv { color:#e06060; font-size:12px; font-variant-numeric:tabular-nums; min-width:0; }
  /* A11: icon bands */
  .decor { position:fixed; left:0; right:0; display:none; justify-content:center; align-items:center; box-sizing:border-box;
    pointer-events:none; overflow:hidden; background:#000; }
  #decTop { border-bottom:1px solid #2a2a2a; } #decBot { border-top:1px solid #2a2a2a; }
  .decor img { display:block; flex:none; object-fit:contain; border-radius:3px; box-shadow:0 0 0 1px #262626; }
</style>
<script src="lib/three.r160.min.js"></script>
<script src="CT40.A12.Solari.embedded.js"></script>
<script src="CT40.A12.Solari.icons.js"></script>
<script src="lib/mp4-muxer.5.2.1.js"></script>
<script src="CT40.A12.Solari.rec.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"><div id="title"></div></div>
<div id="decTop" class="decor"></div>
<div id="decBot" class="decor"></div>
<div id="toast">Click anywhere to enable sound</div>
<div id="bar">
  <div class="grp">
    <button id="bFwd" title="Forward / run (Space)">&#9654; Forward</button>
    <button id="bStop" title="Stop (Space)">&#9632; Stop</button>
    <button id="bReset" title="Reset to start time (R)">&#10227; Reset</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="bRec" title="Reset the sign and record an MP4 movie of it with sound; press again to stop and save (V)">&#9679; Rec from Reset</button>
    <span id="recv"></span>
  </div>
  <div class="sep"></div>
  <div class="grp" title="Clock speed (- / + keys, 1 = real time)">
    Speed
    <button id="bSlow">&minus;</button><span id="speedv">1.00&times;</span><button id="bFast">+</button>
    <button id="b1x" title="Real time">1&times;</button>
  </div>
  <div class="sep"></div>
  <div class="grp" title="Size of the clock and flaps; headings stay put ( [ / ] keys )">
    Size
    <button id="bSmall">&minus;</button><span id="sizev">70%</span><button id="bBig">+</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="bSnd" title="Sound on/off (M).  C = clock clack on/off">Sound ON</button>
    <span>Vol</span><input id="vol" type="range" min="0" max="100" value="100">
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="bIcons" title="Icon bands along the top and bottom on / off (I)">Icons ON</button>
    <button id="bLoad" title="Load edited fields/schedule JSON files">Load JSON&hellip;</button>
    <input id="file" type="file" accept=".json,application/json" multiple>
    <span id="src"></span>
  </div>
</div>
<div id="err"></div>

<script>
'use strict';
/* =====================================================================
   CT40.A12.Solari
   - fields JSON  : drums, field types, columns, board look, clock, sound
   - schedule JSON: labels, start/end time, timed row events
   Board state at clock time T = every event with t <= T applied in order.
   Each character cell is a flap unit on a drum; it only ever advances
   forward through its drum (A->E shows B, C, D), one flap per flapMs.
   ===================================================================== */

const NAME = 'CT40.A12.Solari';
const QS = new URLSearchParams(location.search);
const FIELDS_FILE = NAME + '.fields.json';
const SCHEDULE_FILE = NAME + '.schedule.json';
const SPEEDS = [0.1,0.2,0.25,0.3,0.4,0.5,0.6,0.7,0.75,0.8,0.9,1,1.1,1.2,1.25,1.3,1.4,1.5,1.75,2,2.5,3,4,5,6,8,10,15,20,30,60];

const $ = id => document.getElementById(id);
function fail(msg) { const e = $('err'); e.textContent = msg; e.style.display = 'flex'; throw new Error(msg); }
if (!window.THREE) fail('lib/three.r160.min.js did not load. Keep the lib folder next to ' + NAME + '.html.');

/* ---------- time helpers ---------- */
function parseClock(s) {                       // "10:01 AM" / "9:58:05 PM" -> seconds after midnight
  const m = String(s).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])$/);
  if (!m) throw new Error('bad time "' + s + '"');
  let h = +m[1] % 12; if (m[4].toUpperCase() === 'PM') h += 12;
  return h * 3600 + (+m[2]) * 60 + (+(m[3] || 0));
}
function clockParts(sec) {
  sec = Math.floor(((sec % 86400) + 86400) % 86400);
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return { h12: (h % 12) || 12, m, s, ap: h < 12 ? 'AM' : 'PM' };
}

/* ---------- data loading (real files first, embedded copy if the browser blocks file://) ---------- */
async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  return r.json();
}
async function loadData() {
  const E = window.SOLARI_EMBEDDED;
  try {
    const [f, s] = await Promise.all([fetchJSON(FIELDS_FILE), fetchJSON(SCHEDULE_FILE)]);
    return { fields: f, schedule: s, src: 'Reading ' + FIELDS_FILE + ' + ' + SCHEDULE_FILE };
  } catch (e) {
    if (!E) fail('Could not read the JSON files (' + e.message + ') and ' + NAME + '.embedded.js is missing.');
    return { fields: E.fields, schedule: E.schedule,
      src: 'Local file: using built-in JSON copy. Edited JSON? Use Load JSON or ' + NAME + '.serve.sh.' };
  }
}

/* =====================================================================
   Glyph atlas: every glyph of every drum painted once into a canvas.
   Each tile = one whole flap face (dark plate, glyph, grey split line).
   ===================================================================== */
function buildAtlas(fields) {
  const B = fields.board, C = B.colors, TH = 128, PAD = 4, AW = 2048;
  const drums = fields.drums;
  const tiles = [];                                 // {drum, glyph, w}
  for (const [dn, d] of Object.entries(drums)) {
    if (dn.startsWith('_')) continue;
    const w = Math.round(TH * d.widthUnits * B.cellAspect);
    for (const g of d.glyphs) tiles.push({ dn, g, w, plate: d.plate !== false, img: d.images && d.images[g] ? S.images[d.images[g]] : null, crop: d.imageCrop || 1 });
  }
  // pack
  let x = PAD, y = PAD;
  for (const t of tiles) {
    if (x + t.w + PAD > AW) { x = PAD; y += TH + PAD * 2; }
    t.x = x; t.y = y; x += t.w + PAD * 2;
  }
  let AH = 64; while (AH < y + TH + PAD) AH *= 2;
  const cv = document.createElement('canvas'); cv.width = AW; cv.height = AH;
  const g = cv.getContext('2d');
  g.fillStyle = C.background; g.fillRect(0, 0, AW, AH);
  const font = px => B.font.replace('{px}', px);
  g.font = font(100);
  const capH = (g.measureText('H').actualBoundingBoxAscent || 72) / 100;   // cap height per px of font size
  const map = {};
  for (const t of tiles) {
    // plate
    if (t.plate) {
      const gr = g.createLinearGradient(0, t.y, 0, t.y + TH);
      gr.addColorStop(0, C.flap); gr.addColorStop(0.49, C.flapEdge);
      gr.addColorStop(0.51, C.flap); gr.addColorStop(1, C.flapEdge);
      g.fillStyle = gr;
    } else g.fillStyle = C.background;
    g.fillRect(t.x - PAD, t.y - PAD, t.w + PAD * 2, TH + PAD * 2);   // bleed plate colour into the pad
    // A11: a picture instead of a glyph (the sun / moon of the AM/PM flap): the whole image, fitted inside the plate
    if (t.img) {
      const im = t.img, side = Math.min(t.w, TH) * 0.9, cr = t.crop;              // cr: centre part of the picture used
      const sw = im.naturalWidth * cr, sh = im.naturalHeight * cr, k = side / Math.max(sw, sh), iw = sw * k, ih = sh * k;
      g.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, t.x + (t.w - iw) / 2, t.y + (TH - ih) / 2, iw, ih);
    } else
    // glyph
    if (t.g.trim()) {
      const multi = t.g.length > 1;
      const cap = TH * (multi ? 0.42 : 0.62);
      const px = cap / capH;
      g.font = font(px.toFixed(1));
      g.fillStyle = C.glyph; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      const mw = g.measureText(t.g).width, maxW = t.w * (multi ? 0.84 : 0.86);
      const sx = Math.min(1, maxW / mw);                       // condense wide letters (W, M) like real flaps
      g.save(); g.translate(t.x + t.w / 2, t.y + TH / 2 + cap / 2); g.scale(sx, 1);
      g.fillText(t.g, 0, 0); g.restore();
    }
    // split line that bisects every flap face
    if (t.plate) {
      const lw = Math.max(2, Math.round(TH * 0.026));
      g.fillStyle = '#000'; g.fillRect(t.x - PAD, t.y + TH / 2 - lw / 2 - 1, t.w + PAD * 2, lw + 2);
      g.fillStyle = C.splitLine; g.fillRect(t.x - PAD, t.y + TH / 2 - lw / 2, t.w + PAD * 2, lw);
    }
    // uv rect: (u0, vBottom, u1, vTop); CanvasTexture flips Y so canvas top = v 1
    (map[t.dn] = map[t.dn] || {})[t.g] = [
      (t.x + 0.5) / AW, 1 - (t.y + TH - 0.5) / AH, (t.x + t.w - 0.5) / AW, 1 - (t.y + 0.5) / AH ];
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  return { tex, map, canvas: cv };
}

/* =====================================================================
   Flap renderer: one InstancedMesh, 3 instances per cell
   kind 0 = upper static half, kind 1 = lower static half, kind 2 = falling flap
   ===================================================================== */
const VS = `
attribute vec3 aCenter; attribute vec2 aSize; attribute float aKind;
attribute vec4 aUVa; attribute vec4 aUVb; attribute float aAngle;
varying vec2 vUv; varying float vShade;
void main() {
  float lx = position.x, ly = position.y, hh = aSize.y * 0.5;
  vec3 p; vec4 r = aUVa; float shade = 1.0; float vmid;
  if (aKind < 0.5) {
    p = vec3(lx * aSize.x, ly * hh, 0.0);
    vmid = (r.y + r.w) * 0.5; vUv = vec2(mix(r.x, r.z, lx + 0.5), mix(vmid, r.w, ly));
  } else if (aKind < 1.5) {
    p = vec3(lx * aSize.x, -ly * hh, 0.0);
    vmid = (r.y + r.w) * 0.5; vUv = vec2(mix(r.x, r.z, lx + 0.5), mix(vmid, r.y, ly)); shade = 0.9;
  } else {
    if (aAngle < 0.0) { vUv = vec2(0.0); vShade = 0.0; gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    float c = cos(aAngle), s = sin(aAngle);
    p = vec3(lx * aSize.x, ly * hh * c, ly * hh * s + 1.0);
    if (aAngle < 1.5707963) {                 // front of the leaf: old glyph, upper half
      vmid = (r.y + r.w) * 0.5; vUv = vec2(mix(r.x, r.z, lx + 0.5), mix(vmid, r.w, ly));
      shade = 0.35 + 0.65 * c;
    } else {                                   // back of the leaf: new glyph, lower half
      r = aUVb; vmid = (r.y + r.w) * 0.5; vUv = vec2(mix(r.x, r.z, lx + 0.5), mix(vmid, r.y, ly));
      shade = 0.9 * (0.35 + 0.65 * -c);
    }
  }
  vShade = shade;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(aCenter + p, 1.0);
}`;
const FS = `
uniform sampler2D uAtlas; varying vec2 vUv; varying float vShade;
void main() { gl_FragColor = vec4(texture2D(uAtlas, vUv).rgb * vShade, 1.0); }`;

/* ---------- application state ---------- */
const S = {
  fields: null, schedule: null, atlas: null,
  cells: [],            // every flap unit (board + clock)
  rowCells: [],         // rowCells[row][colId] = [cell...]
  clockCells: [],
  columns: [],          // {id, x, w, cells template}
  rows: [],             // current field values per row
  events: [], evIdx: 0,
  start: 0, end: 0, loop: true,
  clock: 0, running: true, speedIdx: SPEEDS.indexOf(1),
  mesh: null, geo: null, attrs: null,
  layout: null, lastSec: -1, size: 0.7,
};

/* A12: movie recording state (see the recording section further down) */
const REC = { take: null, starting: false, finishing: false, fps: Math.max(10, Math.min(60, +(QS.get('fps') || 60))), SR: 48000,
  voices: [], W: 0, H: 0, comp: null, g: null, overlay: null, imgs: {} };

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, 1, 0, -1, -1000, 1000);

/* ---------- cells ---------- */
function makeCell(drumName, row, colId, isClock) {
  const d = S.fields.drums[drumName];
  if (!d) fail('fields JSON: unknown drum "' + drumName + '"');
  const c = { drum: drumName, glyphs: d.glyphs, index: new Map(d.glyphs.map((g, i) => [g, i])),
    wu: d.widthUnits, cur: 0, target: 0, next: 0, flipping: false, t0: 0,
    row, colId, isClock, x: 0, y: 0, w: 0, h: 0, i: S.cells.length };
  if (d.glyphs.length === 1) c.static = true;
  S.cells.push(c);
  return c;
}
function cellsForType(col) {       // -> array of drum names / 'gap'
  const t = S.fields.types[col.type];
  if (!t) fail('fields JSON: unknown type "' + col.type + '" in column ' + col.id);
  if (t.kind === 'text') return Array(col.length || 10).fill(t.drum);
  if (t.cells) return t.cells.slice();
  fail('fields JSON: type "' + col.type + '" needs kind "text" or a cells list');
}

function buildCells() {
  S.cells = []; S.rowCells = []; S.clockCells = []; S.columns = [];
  const F = S.fields, B = F.board;
  for (const col of F.columns) S.columns.push({ id: col.id, def: col, spec: cellsForType(col) });
  for (let r = 0; r < B.rows; r++) {
    const rc = {};
    for (const col of S.columns)
      rc[col.id] = col.spec.map(dn => dn === 'gap' ? null : makeCell(dn, r, col.id, false));
    S.rowCells.push(rc);
  }
  if (F.clock && F.clock.show !== false) {
    const apd = (F.clock.ampmDrum && F.drums[F.clock.ampmDrum]) ? F.clock.ampmDrum : 'ampm';   // A11: letters (default) or sun / moon
    const spec = ['digit','digit','colon','digit','digit','colon','digit','digit','gap',apd];
    S.clockSpec = spec;
    S.clockCells = spec.map(dn => dn === 'gap' ? null : makeCell(dn, -1, 'clock', true));
  }
}

/* ---------- layout (CSS pixels, y down) ---------- */
// Per-type spacing (A10): a field type may set its own cellGapUnits / gapUnits (e.g. the time field is spread out).
function colGaps(col) {
  const B = S.fields.board, t = (col && S.fields.types[col.def.type]) || {};
  return { cg: t.cellGapUnits != null ? t.cellGapUnits : B.cellGapUnits, gg: t.gapUnits != null ? t.gapUnits : B.gapUnits };
}
function specWidth(spec, cg, gg) {     // width in units of a list of cells
  let w = 0, n = 0;
  for (const dn of spec) { w += dn === 'gap' ? gg : S.fields.drums[dn].widthUnits; n++; }
  return w + Math.max(0, n - 1) * cg;
}
function layout() {
  // Two scales since A7:
  //   uL = label unit: title + column headings, fixed at board.labelSize of the full-window fit
  //   u  = flap unit : master clock + flap rows, scaled by the Size control (board.size)
  // Since A10 each column is as wide as the wider of its flaps and its heading, so a long heading
  // ("DEPARTURE TIME") never runs into the next column.
  const W = window.innerWidth, BAR0 = $('bar').offsetHeight || 52;
  sizeDecor();
  const DEC = decorH(), H = window.innerHeight - DEC, BAR = BAR0 + DEC;   // A11: the icon bands take DEC px at the top and above the bar
  const B = S.fields.board, CL = S.fields.clock || {};
  const LS = B.labelSize || 0.7;
  const cellH = 1 / B.cellAspect;                  // in units (unit = one cell width)
  const sc = CL.scale || 1.4;

  // headings: create them, and measure each one's width per px of font size
  const labels = $('labels');
  labels.querySelectorAll('.lab').forEach(n => n.remove());
  const labEls = S.columns.map(col => {
    const el = document.createElement('div'); el.className = 'lab';
    el.textContent = (S.schedule.labels && S.schedule.labels[col.id]) || col.id.toUpperCase();
    el.style.fontSize = '100px'; el.style.left = '0px'; el.style.top = '-9999px';
    labels.appendChild(el); return el;
  });
  const labPerPx = labEls.map(el => el.offsetWidth / 100);     // width / font-size
  const LABF = 0.62;                                              // heading font size = 0.62 uL

  const colW = S.columns.map(c => { const g = colGaps(c); return specWidth(c.spec, g.cg, g.gg); });
  const nGap = S.columns.length - 1;
  // width at full size (u = uL/LS = fit): each column = max(flaps, heading)
  const KW = colW.reduce((a, w, i) => a + Math.max(w, labPerPx[i] * LABF * LS), 0) + nGap * B.columnGapUnits;
  const clockH = S.clockCells.length ? cellH * sc : 0;
  const rowsH = B.rows * cellH + (B.rows - 1) * B.rowGapUnits;
  const fitUnits = 0.8 + clockH + 0.9 + 1.0 + 0.35 + rowsH + 0.8;
  const fit = Math.min(W / (KW + 2.4), (H - BAR) / fitUnits);
  const uL = Math.max(3, fit * LS);
  const u = Math.max(2, fit * S.size);
  const labPx = LABF * uL, titlePx = 0.95 * uL;
  const slot = colW.map((w, i) => Math.max(w * u, labPerPx[i] * labPx));
  const boardPx = slot.reduce((a, b) => a + b, 0) + nGap * B.columnGapUnits * u;
  const labRow = labPx * 1.25 + 0.3 * u;
  const totalH = 0.8 * u + clockH * u + Math.max(0.9 * u, labPx) + labRow + rowsH * u;
  const x0 = (W - boardPx) / 2;
  let y = DEC + Math.max(8, ((H - BAR) - totalH) / 2);

  // master clock, top centre
  const clockTop = y;
  if (S.clockCells.length) {
    const cw = specWidth(S.clockSpec, B.cellGapUnits, B.gapUnits) * u * sc;
    let cx = (W - cw) / 2; const ch = cellH * u * sc;
    S.clockSpec.forEach((dn, k) => {
      const wu = dn === 'gap' ? B.gapUnits : S.fields.drums[dn].widthUnits;
      const c = S.clockCells[k];
      if (c) { c.w = wu * u * sc - 0.001; c.h = ch; c.x = cx + c.w / 2; c.y = y + ch / 2; }
      cx += (wu + B.cellGapUnits) * u * sc;
    });
    y += ch + Math.max(0.9 * u, labPx);
  }
  // title (left edge of board, level with clock)
  const title = $('title');
  title.textContent = S.schedule.title || '';
  title.style.fontSize = titlePx + 'px';
  title.style.left = x0 + 'px';
  title.style.top = (S.clockCells.length ? clockTop + (clockH * u - titlePx * 1.15) / 2 : y - titlePx * 1.5) + 'px';

  // column headings: left-aligned over their column (right-aligned for right-aligned fields)
  let x = x0;
  S.columns.forEach((col, ci) => {
    col.x = x; col.slot = slot[ci]; col.w = colW[ci] * u;
    const el = labEls[ci];
    el.style.fontSize = labPx + 'px'; el.style.top = y + 'px';
    if (col.def.align === 'right') { el.style.left = ''; el.style.right = (W - (x + slot[ci])) + 'px'; }
    else el.style.left = x + 'px';
    x += slot[ci] + B.columnGapUnits * u;
  });
  y += labRow;

  // rows (right-aligned fields sit at the right edge of their slot)
  for (let r = 0; r < B.rows; r++) {

  for (const [id, top] of [['decTop', true], ['decBot', false]]) {
    const el = $(id); if (el.style.display === 'none') continue;
    const r = el.getBoundingClientRect();
    g.fillStyle = '#000'; g.fillRect(r.left * k, r.top * k, r.width * k, r.height * k);
    g.fillStyle = '#2a2a2a'; g.fillRect(r.left * k, (top ? r.bottom - 1 : r.top) * k, r.width * k, Math.max(1, k));
    el.querySelectorAll('img').forEach(im => {
      const q = im.getBoundingClientRect(), pic = REC.imgs[im.dataset.path];
      if (!pic || !pic.complete || !pic.naturalWidth || q.right < r.left || q.left > r.right) return;
      const x = q.left * k, y = q.top * k, w = q.width * k, h = q.height * k, rad = 3 * k;
      g.save(); g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, rad) : g.rect(x, y, w, h); g.clip();
      const sc = Math.min(w / pic.naturalWidth, h / pic.naturalHeight), iw = pic.naturalWidth * sc, ih = pic.naturalHeight * sc;
      g.drawImage(pic, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih); g.restore();
      g.strokeStyle = '#262626'; g.lineWidth = Math.max(1, k); g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, rad) : g.rect(x, y, w, h); g.stroke();
    });
  }
  const texts = [$('title'), ...$('labels').querySelectorAll('.lab')];
  for (const el of texts) {
    const txt = el.textContent; if (!txt) continue;
    const cs = getComputedStyle(el), r = el.getBoundingClientRect();
    g.font = `${cs.fontWeight} ${parseFloat(cs.fontSize) * k}px ${cs.fontFamily}`;
    if ('letterSpacing' in g) g.letterSpacing = (parseFloat(cs.letterSpacing) || 0) * k + 'px';
    g.fillStyle = cs.color; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    const m = g.measureText(txt), asc = m.fontBoundingBoxAscent || parseFloat(cs.fontSize) * k * 0.8, des = m.fontBoundingBoxDescent || parseFloat(cs.fontSize) * k * 0.2;
    g.fillText(txt, r.left * k, r.top * k + (r.height * k - (asc + des)) / 2 + asc);
  }
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
function recFrame() {                      // called right after renderer.render(), while the WebGL picture is still there
  const g = REC.g, gl = renderer.domElement, rc = recRegionCss(), pr = gl.width / window.innerWidth;
  g.fillStyle = S.fields.board.colors.background; g.fillRect(0, 0, REC.W, REC.H);
  const sh = Math.min(gl.height, Math.round(rc.h * pr));
  g.drawImage(gl, 0, 0, gl.width, sh, 0, 0, REC.W, sh * REC.W / gl.width);
  g.drawImage(REC.overlay, 0, 0);
  REC.take.add(null);
  if (REC.take.frames % 15 === 1) showRec();
}
function fmtDur(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); }
function showRec(msg) {
  const b = $('bRec'), on = !!REC.take;
  b.innerHTML = on ? '&#9632; Stop &amp; save movie' : '&#9679; Rec from Reset';
  b.classList.toggle('rec', on); b.classList.toggle('busy', REC.starting || REC.finishing);
  $('recv').textContent = msg != null ? msg : on ? `REC ${fmtDur(REC.take.seconds)} · ${REC.W}×${REC.H} ${REC.fps} fps` : (REC.last || '');
}
async function recToggle() {
  if (REC.starting || REC.finishing) return;
  if (REC.take) return recStop();
  if (!SolariRec.supported()) { alert('This browser cannot make movies (it needs WebCodecs: Chrome or Edge 94 or later).'); return; }
  unlockAudio();
  REC.starting = true; showRec('Preparing the encoder…');
  try {
    const rc = recRegionCss(), pr = renderer.getPixelRatio();
    let W = rc.w * pr, H = rc.h * pr; const fit = Math.min(1, 3840 / W, 2160 / H);
    REC.W = even(W * fit); REC.H = even(H * fit);
    const pick = await SolariRec.prepare(REC.W, REC.H, REC.fps, REC.SR);
    if (!pick) throw new Error('no video encoder worked at ' + REC.W + '×' + REC.H + '.\n' + SolariRec.tried.join('\n'));
    const apick = Snd.buf ? SolariRec.audioPick : null;
    REC.comp = document.createElement('canvas'); REC.comp.width = REC.W; REC.comp.height = REC.H;
    REC.g = REC.comp.getContext('2d', { alpha: false });
    REC.overlay = document.createElement('canvas'); REC.overlay.width = REC.W; REC.overlay.height = REC.H;
    REC.voices = [];
    REC.take = SolariRec.Take(REC.comp, REC.W, REC.H, REC.fps, REC.SR, pick, apick);
    REC.codec = pick.name + (apick ? ' + ' + (apick.mux === 'aac' ? 'AAC' : 'Opus') : ' (no sound encoder)');
    buildOverlay();
    reset(); forward();                    // the take starts from a reset, running
  } catch (e) { REC.take = null; alert('Could not start recording: ' + (e && e.message || e)); }
  REC.starting = false; showRec();
}
async function renderMovieAudio(take, nTotal) {   // the logged clacks -> the movie's sound, in 30 s pieces
  const SR = REC.SR, SEG = 30 * SR, PRE = SR, cfg = Snd.cfg || {};
  const voices = REC.voices.slice().sort((a, b) => a.t - b.t);
  let vi = 0;
  for (let s0 = 0; s0 < nTotal; s0 += SEG) {
    const a = Math.max(0, s0 - PRE), b = Math.min(nTotal, s0 + SEG);   // a: 1 s of run-up so the compressor is settled
    const oc = new OfflineAudioContext(2, b - a, SR);
    const inp = buildChain(oc, cfg, oc.destination);
    while (vi < voices.length && voices[vi].t * SR < a) vi++;
    for (let j = vi; j < voices.length && voices[j].t * SR < b; j++) startVoice(oc, inp, Snd.buf, voices[j], voices[j].t - a / SR);
    const ab = await oc.startRendering();
    const L = ab.getChannelData(0), R = ab.numberOfChannels > 1 ? ab.getChannelData(1) : L;
    for (let p = s0; p < b; p += 4800) {
      const n = Math.min(4800, b - p), d = new Float32Array(n * 2);
      d.set(L.subarray(p - a, p - a + n), 0); d.set(R.subarray(p - a, p - a + n), n);
      take.addAudio(d);
      while (take.audioBusy()) await new Promise(r => setTimeout(r, 5));
    }
    showRec('Saving… sound ' + Math.round(100 * b / nTotal) + '%');
  }
}
async function recStop() {
  const take = REC.take; REC.take = null; REC.finishing = true; showRec('Saving…');
  try {
    if (!take.frames) throw new Error('no frames were recorded');
    const nTotal = Math.round(take.frames * REC.SR / REC.fps);
    if (take.hasAudio && Snd.buf) await renderMovieAudio(take, nTotal);
    const blob = await take.finish();
    const d = new Date(), z = v => String(v).padStart(2, '0');
    const fname = `${NAME}_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.mp4`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    REC.last = `Saved ${fname} · ${fmtDur(take.seconds)} · ${take.w}×${take.h} ${take.fps} fps · ${(blob.size / 1e6).toFixed(1)} MB`;
    REC.lastBlob = blob;
    console.log(REC.last, REC.codec);
  } catch (e) { REC.last = 'Recording failed'; alert('Recording failed: ' + (e && e.message || e)); }
  REC.finishing = false; lastT = performance.now(); showRec();
}
$('bRec').onclick = recToggle;

/* ---------- start ---------- */
async function start(fields, schedule) {
  await loadImages(fields);
  buildDecor(fields);
  S.fields = fields; S.schedule = schedule;
  S.flapMs = fields.board.flapMs || 110;
  S.clockSound = !!(fields.clock && fields.clock.sound !== false);
  const ps = pref('size'); S.size = ps != null ? ps : (fields.board.size || 0.7); showSize();
  document.body.style.background = fields.board.colors.background;
  renderer.setClearColor(fields.board.colors.background);
  if (S.atlas) S.atlas.tex.dispose();
  S.atlas = buildAtlas(fields);
  buildCells();
  prepSchedule();
  layout();
  buildMesh();
  S.clock = S.start; S.lastSec = -1;
  rebuildStateAt(simNow);
}
(async () => {
  const d = await loadData();
  $('src').textContent = d.src;
  await start(d.fields, d.schedule);
  showRun(); showSpeed();
  initSound(d.fields.sound || {});
  window.SOLARI = S;                     // handy for debugging in the console
  requestAnimationFrame(t => { lastT = t; frame(t); });
  if (QS.get('rec') === '1') setTimeout(recToggle, 500);     // A12 test hook: start recording on opening
})().catch(e => fail(String(e && e.message || e)));
</script>
